{% load static %}
<header>
    <!-- AMAZON LOGO -->
    <div class="logo">
        <a href="{% url 'home' %}">
            <img src="{% static 'images/amazon_logo.png' %}" alt="Amazon Logo">
        </a>
    </div>

    <!-- LOCATION -->
    <div class="location_box">
        <i class="fa-solid fa-location-dot"></i>
        <div>
            <div class="text_small">
                Deliver to Mohit
            </div>
            <div class="text_update">
                New Delhi 110032
            </div>
        </div>
    </div>

    <!-- SEARCH BAR -->
    <div class="search_box">
        <select aria-label="Select Category">
            <option>All</option>
            <option>Electronics</option>
            <option>Mobiles</option>
            <option>Fashion</option>
            <option>Home</option>
            <option>Books</option>
        </select>
        <input type="text" placeholder="Search Amazon.in" aria-label="Search Amazon.in">
        <button type="button" aria-label="Search">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </div>

    <!-- LANGUAGE -->
    <div class="language_box">
        <span class="flag">🇮🇳</span>
        <span>EN</span>
        <i class="fa-solid fa-caret-down"></i>
    </div>

    <!-- ACCOUNT -->
    <div class="account_box">
        <div class="text_small">
            Hello, sign in
        </div>
        <div class="account_text">
            Account &amp; Lists
            <i class="fa-solid fa-caret-down"></i>
        </div>
    </div>

    <!-- RETURNS AND ORDERS -->
    <div class="orders_box">
        <div class="text_small">
            Returns
        </div>
        <div class="orders_text">
            &amp; Orders
        </div>
    </div>

    <!-- CART -->
    <div class="cart_box">
        <div class="cart_icon">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="cart_number">0</span>
        </div>
        <span class="cart_text">Cart</span>
    </div>
</header>
